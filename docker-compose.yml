# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api_github:
    container_name: GithubLibreChat
    ports:
      - "${PORT}:${PORT}"
    image: ghcr.io/danny-avila/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-28000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-28000}
    volumes:
      - /home/pdidc/LibreChat/images:/app/client/public/images
      - /home/pdidc/LibreChat/uploads:/app/uploads
      - /home/pdidc/LibreChat/logs:/app/logs
